services:
  mysql:
    image: mysql:8.4
    container_name: career-orbit-mysql
    environment:
      MYSQL_DATABASE: career_orbit
      MYSQL_USER: career
      MYSQL_PASSWORD: career_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    container_name: career-orbit-redis
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: career-orbit-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.5
    container_name: career-orbit-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: ["es_data:/usr/share/elasticsearch/data"]
volumes:
  mysql_data:
  redis_data:
  minio_data:
  es_data:
